[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "Agentic SDLC orchestration system, demonstrated via a URL shortener service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "service*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
claude = [
    "anthropic>=0.34",
]

[tool.pytest.ini_options]
testpaths = ["service/tests", "orchestrator/tests"]
pythonpath = ["."]
